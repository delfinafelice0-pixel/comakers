<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · CoMakers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233D8078'/%3E%3Cpath d='M20.8 9.6A8 8 0 1 0 20.8 20.4' fill='none' stroke='%23FFB040' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='25.4' cy='25.4' r='3' fill='%23FFB040'/%3E%3C/svg%3E">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3D8078">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CoMakers">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Paleta: copia literal de paleta-nueva-tokens.css. */
  :root{
    /* ---- Marca (los 3 que pidió Delfi) ---- */
    --cm-teal:#3D8078;        /* primario: nav activa, botones, títulos */
    --cm-orange:#FFB040;      /* acento: CTAs, resaltados (NUNCA como texto) */
    --cm-pink:#FFD0FC;        /* highlight suave: tags, fondos sutiles, pills */

    /* ---- Derivados de teal (sidebars, hovers, fondos) ---- */
    --teal-900:#20302E;       /* casi negro verdoso = color de texto principal */
    --teal-700:#2E635C;       /* hover de botones teal, bordes fuertes */
    --teal-50:#E3EFEC;        /* fondo teal muy claro (filas activas, chips) */

    /* ---- Neutros ---- */
    --bg:#FFF9F3;             /* fondo de página (crema) */
    --surface:#FFFFFF;        /* tarjetas, tablas, modales */
    --surface-2:#F6F1EA;      /* fondo alterno, encabezados de tabla */
    --text:#20302E;           /* texto principal */
    --text-soft:#5F726F;      /* texto secundario */
    --text-mute:#8A968F;      /* placeholders, deshabilitado */
    --border:#E7E2E8;         /* bordes y divisores */
    --border-strong:#D6CEDA;

    /* ---- Roles de uso (apuntá SIEMPRE a estos en los componentes) ---- */
    --primary:var(--cm-teal);        --primary-contrast:#FFFFFF;
    --primary-strong:#30675F;        /* SOLO texto chico teal sobre crema o fondos tintados claros
                                        (--primary ahí da 4,41: no llega a AA). Botones, fills y
                                        texto grande siguen en --primary. */
    --accent:var(--cm-orange);       --accent-contrast:#3A2600; /* texto oscuro sobre naranja */
    --highlight:var(--cm-pink);      --highlight-contrast:#20302E; /* texto verde oscuro sobre rosa */
    --sidebar-bg:#23403B;            --sidebar-text:#E8F0ED; --sidebar-active:var(--cm-orange);

    /* ---- Estados / semánticos (NO usar el trío de marca para esto) ---- */
    --success:#2E9E6B;   --success-bg:#E4F4EC;   --success-text:#1C6B48;
    --warning:#E0902A;   --warning-bg:#FBEDD7;   --warning-text:#8A5410;
    --danger:#D8504F;    --danger-bg:#FBE6E6;    --danger-text:#9A2E2D;
    --info:#3E7FB5;      --info-bg:#E4EFF8;      --info-text:#265A86;

    /* ---- Data viz: paleta categórica para los gráficos de los reportes ---- */
    --c1:#3D8078; --c2:#FFB040; --c3:#5B8DEF; --c4:#E07BC4; --c5:#8E7BD6; --c6:#58B98E;

    /* ---- Tipografía ---- */
    --font:'Poppins',system-ui,sans-serif;
  }
  :root { --radius: 10px; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg) url("paper-bg.jpg") center top/cover fixed;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 40px;
    width: 100%;
    max-width: 390px;
    box-shadow: 0 10px 30px rgba(32,48,46,0.08);
  }

  .brand { margin-bottom: 30px; }
  /* Logo de texto: "Co" teal, "Makers" naranja (decisión de marca). */
  .brand-name {
    font-family: var(--font); font-size: 28px; font-weight: 800;
    letter-spacing: -0.02em; line-height: 1;
    display: inline-flex; align-items: baseline;
  }
  .brand-name .co { color: var(--primary); }
  .brand-name .mk { color: var(--accent); }
  .brand-sub {
    font-size: 11px;
    color: var(--text-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 26px;
  }

  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  input[type="email"],
  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 11px 12px;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input::placeholder { color: var(--text-mute); }
  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--teal-50);
  }
  input.error { border-color: var(--danger); }

  .error-msg {
    font-size: 12px;
    color: var(--danger-text);
    margin-top: 8px;
    display: none;
  }
  .error-msg.visible { display: block; }

  .btn {
    width: 100%;
    background: var(--primary);
    color: var(--primary-contrast);
    border: none;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--teal-700); }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .link-flojo {
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: inherit; font-size: 12.5px; color: var(--text-soft);
    text-decoration: underline; text-underline-offset: 2px;
  }
  .link-flojo:hover { color: var(--primary-strong); }
  .fila-olvide { display: flex; justify-content: flex-end; margin-top: -6px; }
  .aviso-ok {
    background: var(--success-bg); color: var(--success-text); border-radius: 10px; padding: 11px 13px;
    font-size: 13px; line-height: 1.5; margin-top: 14px;
  }

  .footer-note {
    font-size: 12px;
    color: var(--text-soft);
    text-align: center;
    margin-top: 24px;
  }
  @media (max-width: 420px) { .card { padding: 30px 22px; } }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-name"><span class="co">Co</span><span class="mk">Makers</span></div>
    <div class="brand-sub">Acceso al panel</div>
  </div>

  <h1>Iniciar sesión</h1>
  <p class="subtitle">Ingresá con tu cuenta para ver tu panel.</p>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="tu@email.com" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>

    <div class="fila-olvide">
      <button type="button" class="link-flojo" id="olvide">¿Olvidaste tu contraseña?</button>
    </div>

    <div class="error-msg" id="errorMsg">Email o contraseña incorrectos. Intentá de nuevo.</div>
    <div class="aviso-ok" id="avisoOk" style="display:none"></div>

    <button type="submit" class="btn" id="submitBtn">Entrar</button>
  </form>

  <!-- Cuando volvés del mail de recuperación -->
  <form id="nuevaForm" novalidate style="display:none">
    <div class="field">
      <label for="pass1">Contraseña nueva</label>
      <input type="password" id="pass1" placeholder="Al menos 8 caracteres" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="pass2">Repetila</label>
      <input type="password" id="pass2" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="error-msg" id="errorNueva"></div>
    <button type="submit" class="btn" id="btnNueva">Guardar y entrar</button>
  </form>

  <p class="footer-note">¿Problemas para entrar? Escribile a Delfi.</p>
</div>

<script>
  // ── SUPABASE CONFIG ──────────────────────────────────
  const SUPABASE_URL      = 'https://ggcstolnadkkqhsqpzql.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnY3N0b2xuYWRra3Foc3FwenFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzM0MjQsImV4cCI6MjA5NjE0OTQyNH0.iUipHKX0AcSLVrEvQOLEHqVJlDq_rTEyBTRR1tDBjEs';

  // ── ¿VENIMOS DE UN MAIL? ─────────────────────────────
  //  Se mira ANTES de crear el cliente: al crearlo, Supabase procesa el
  //  token y limpia la URL. Si lo leyéramos después, a veces ya no está.
  //
  //  Los dos mails que caen en esta página —la invitación a alguien
  //  nuevo y la recuperación de contraseña— necesitan lo mismo: que la
  //  persona ELIJA una contraseña. Por eso no se distingue entre uno y
  //  otro: si venís de un link de mail, ponés contraseña.
  //
  //  Antes esto solo miraba `type=recovery`. Una invitación llega con
  //  `type=invite`, así que caía por el otro lado: Supabase le abría
  //  la sesión y la persona entraba al panel SIN haber puesto nunca una
  //  contraseña. Entraba esa vez y ninguna más, sin entender por qué.
  const _hash  = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  const _query = new URLSearchParams(location.search || '');
  const _tipo  = _hash.get('type') || _query.get('type') || '';
  const vengoDeUnMail =
    _tipo === 'recovery' || _tipo === 'invite' ||
    // El flujo nuevo de Supabase no manda `type`: manda un `code`. Como
    // acá los únicos mails que llegan son esos dos, alcanza con que haya
    // uno para saber que hay que pedir contraseña.
    !!_query.get('code') || !!_hash.get('access_token');

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── A DÓNDE VA CADA UNO ──────────────────────────────
  // Agencia (o super admin) → panel interno.
  // Cliente → su panel de reportes.
  // Si el perfil no se puede leer, cae al panel de cliente (lo más restrictivo).
  async function irAlPanel(session) {
    let destino = 'panel-comakers.html';
    try {
      const { data: perfil } = await sb
        .from('profiles')
        .select('tipo, super_admin')
        .eq('id', session.user.id)
        .single();
      if (perfil && (perfil.tipo === 'agencia' || perfil.super_admin)) {
        destino = 'interno.html';
      }
    } catch (e) { /* nos quedamos con el destino por defecto */ }
    window.location.href = destino;
  }

  if (vengoDeUnMail) {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('nuevaForm').style.display = '';
    const esInvitacion = _tipo === 'invite';
    document.querySelector('h1').textContent = esInvitacion
      ? 'Bienvenida — elegí tu contraseña'
      : 'Elegí una contraseña nueva';
    document.querySelector('.subtitle').textContent = esInvitacion
      ? 'La elegís vos y no la ve nadie más, ni nosotras. Con esto entrás al panel.'
      : 'La anterior no la puede ver nadie, ni nosotras. Poné una nueva y entrás directo.';
  } else {
    // Si ya hay sesión activa, ir directo al panel que corresponda
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) irAlPanel(session);
    });
  }

  const form    = document.getElementById('loginForm');
  const emailEl = document.getElementById('email');
  const passEl  = document.getElementById('password');
  const errEl   = document.getElementById('errorMsg');
  const btn     = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('visible');
    emailEl.classList.remove('error');
    passEl.classList.remove('error');

    const email    = emailEl.value.trim();
    const password = passEl.value;

    if (!email || !password) {
      errEl.textContent = 'Completá email y contraseña.';
      errEl.classList.add('visible');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando…';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Entrar';
      errEl.textContent = 'Email o contraseña incorrectos. Intentá de nuevo.';
      errEl.classList.add('visible');
      emailEl.classList.add('error');
      passEl.classList.add('error');
      return;
    }

    await irAlPanel(data.session);
  });

  // ── OLVIDÉ MI CONTRASEÑA ─────────────────────────────
  const avisoOk = document.getElementById('avisoOk');

  document.getElementById('olvide').addEventListener('click', async () => {
    const email = emailEl.value.trim();
    errEl.classList.remove('visible');
    avisoOk.style.display = 'none';

    if (!email) {
      errEl.textContent = 'Escribí tu email arriba y volvé a apretar.';
      errEl.classList.add('visible');
      emailEl.focus();
      return;
    }

    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });

    // A propósito decimos lo mismo haya o no una cuenta con ese mail:
    // si dijéramos "ese mail no existe", cualquiera podría averiguar
    // quién tiene cuenta probando direcciones.
    if (error && /rate|limit|seconds/i.test(error.message)) {
      errEl.textContent = 'Esperá un momento antes de pedir otro mail.';
      errEl.classList.add('visible');
      return;
    }
    avisoOk.textContent = 'Listo. Si hay una cuenta con ese mail, te llega un link para ' +
      'poner una contraseña nueva. Revisá también el correo no deseado.';
    avisoOk.style.display = '';
  });

  // ── PONER LA CONTRASEÑA NUEVA ────────────────────────
  const nuevaForm = document.getElementById('nuevaForm');
  const errNueva  = document.getElementById('errorNueva');
  const btnNueva  = document.getElementById('btnNueva');

  nuevaForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errNueva.classList.remove('visible');
    const p1 = document.getElementById('pass1').value;
    const p2 = document.getElementById('pass2').value;

    if (p1.length < 8) {
      errNueva.textContent = 'Tiene que tener al menos 8 caracteres.';
      errNueva.classList.add('visible');
      return;
    }
    if (p1 !== p2) {
      errNueva.textContent = 'Las dos no coinciden.';
      errNueva.classList.add('visible');
      return;
    }

    btnNueva.disabled = true;
    btnNueva.textContent = 'Guardando…';

    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) {
      btnNueva.disabled = false;
      btnNueva.textContent = 'Guardar y entrar';
      errNueva.textContent = /expired|invalid/i.test(error.message)
        ? 'Ese link ya venció. Pedí uno nuevo desde "¿Olvidaste tu contraseña?".'
        : 'No se pudo guardar: ' + error.message;
      errNueva.classList.add('visible');
      return;
    }

    const { data } = await sb.auth.getSession();
    if (data && data.session) await irAlPanel(data.session);
    else window.location.href = window.location.pathname;
  });

  // ── PWA: registra el service worker (que la app se pueda instalar) ──
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>

</body>
</html>
