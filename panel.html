<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes · CoMakers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D3FF99'/%3E%3Cpath d='M20.8 9.6A8 8 0 1 0 20.8 20.4' fill='none' stroke='%23FF82FF' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='25.4' cy='25.4' r='3' fill='%23FF82FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #EFEEF2;
    --bg-elev: #FFFFFF;
    --ink: #1B1620;
    --ink-soft: #5B525E;
    --ink-mute: #938C99;
    --line: #ECEAF0;
    --line-soft: #F3F1F6;
    --accent: #FF82FF;
    --accent-soft: #FFE9FE;
    --lime: #D3FF99;
    --lime-soft: #ECFBD4;
    --coral: #F26A8D;
    --coral-soft: #FDE4EB;
    --cyan: #CBEEF3;
    --cyan-soft: #EAF8FB;
    --display: 'Playfair Display', Georgia, serif;
    --body: 'DM Sans', system-ui, sans-serif;
    --radius: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: var(--body);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    min-height: 100vh;
  }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Estructura: la misma que administración ──
     Menú fijo a la izquierda, contenido a la derecha. Las clases se
     llaman igual que allá (.sidebar, .brand, .nav-item, .user-card,
     .mes-nav) a propósito: si algún día se sacan a un CSS común, no
     hay que renombrar nada. */
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--bg-elev); border-right: 1px solid var(--line);
    padding: 24px 16px; display: flex; flex-direction: column; gap: 20px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { padding: 4px 8px 16px; border-bottom: 1px solid var(--line); }
  .brand-name {
    font-family: var(--body); font-size: 19px; font-weight: 700;
    letter-spacing: -0.01em; color: var(--accent); background: var(--lime);
    padding: 5px 9px; border-radius: 9px;
    display: inline-flex; align-items: baseline; line-height: 1;
  }
  .brand-name em { font-family: var(--display); font-style: normal; font-weight: 700; color: var(--accent); }
  .brand-spark { width: 12px; height: 12px; margin-left: 5px; color: var(--accent); align-self: flex-start; flex-shrink: 0; }

  /* El cliente se elige en una caja, como en el CRM. Con un solo
     cliente (lo que ve un cliente) la caja muestra el nombre y nada más. */
  .cliente-caja {
    position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 2px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; min-width: 0;
  }
  .cliente-caja:focus-within { border-color: var(--accent); }
  .cliente-caja .cc-lbl {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-mute); flex-shrink: 0;
  }
  .cliente-caja .cc-nom, .cliente-caja select {
    font-size: 14px; font-weight: 600; color: var(--ink); min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* El cliente ve su nombre entero; el desplegable de la agencia no
     puede partir en dos líneas y recorta con puntos. */
  .cliente-caja .cc-nom { white-space: normal; }
  .cliente-caja select {
    flex: 1; width: 100%; appearance: none; -webkit-appearance: none;
    border: 0; background: transparent; padding: 0 20px 0 0; cursor: pointer;
  }
  .cliente-caja select:focus-visible { outline: none; }
  .cliente-caja .cc-chev {
    position: absolute; right: 12px; top: 50%; width: 14px; height: 14px;
    margin-top: -7px; color: var(--ink-mute); pointer-events: none;
  }

  /* Navegación del panel: un ítem por módulo. Hoy solo Reportes. */
  .nav-group { display: flex; flex-direction: column; gap: 1px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 8px 10px; border: 0; border-radius: 8px; background: none; cursor: pointer;
    color: var(--ink-soft); font-size: 13px; font-weight: 500;
    transition: background 0.12s, color 0.12s;
  }
  .nav-item:hover { background: var(--line-soft); color: var(--ink); }
  .nav-item.active { background: var(--accent); color: var(--ink); }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--ink-mute); }
  .nav-item.active svg { color: inherit; }

  .sidebar-footer {
    margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 10px;
  }
  .link-interno {
    font-size: 11px; color: var(--ink-mute); padding: 8px 10px;
    border: 1px dashed var(--line); border-radius: 8px;
    display: flex; align-items: center; gap: 6px; text-decoration: none;
  }
  .link-interno:hover { border-color: var(--ink-soft); color: var(--ink-soft); }
  .link-interno svg { width: 12px; height: 12px; }
  .user-card { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; flex-shrink: 0;
  }
  .user-info { line-height: 1.2; min-width: 0; }
  .user-name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-role { font-size: 11px; color: var(--ink-mute); }
  .logout {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-mute); padding: 8px 10px; text-align: left; border-radius: 8px;
    border: 0; background: none; cursor: pointer;
  }
  .logout:hover { background: var(--line-soft); color: var(--ink); }

  .main { padding: 32px 40px 72px; min-width: 0; width: 100%; max-width: 1240px; }

  /* El mes se cambia con flechas, igual que en administración. */
  .mes-nav {
    display: flex; align-items: center; gap: 2px;
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px;
  }
  .mes-nav button {
    border: none; background: none; cursor: pointer; font-family: var(--body);
    color: var(--ink-soft); border-radius: 999px; padding: 5px 9px; font-size: 13px;
  }
  .mes-nav button:hover { background: var(--line-soft); color: var(--ink); }
  .mes-nav button[disabled] { opacity: .35; cursor: default; background: none; }
  .mes-nav .mes-txt {
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    padding: 0 8px; min-width: 118px; text-align: center; text-transform: capitalize;
  }

  /* La barra del celular y la tapa oscura. En escritorio no existen. */
  .barra-movil, .tapa-menu { display: none; }
  .cabecera + .vacio { padding-top: 4px; }

  /* Tarjetas: el numero manda. */
  .metricas { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .met { padding: 18px 20px 16px; }
  .met .et { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .met .val { font-size: 38px; }
  .met .delta.bien::before { content: '▲ '; }
  .met .delta.mal::before  { content: '▼ '; }

  /* Bloques que escribe la agencia */
  .bloque-extra .pregunta {
    font-family: var(--display); font-style: italic;
    color: var(--ink-soft); margin: -6px 0 12px; max-width: 62ch;
  }
  .acc-bloque { display: flex; gap: 8px; margin-top: 12px; }
  .ed-bloque { display: flex; flex-direction: column; gap: 10px; }
  .ed-bloque input, .ed-bloque textarea {
    width: 100%; font: inherit; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink);
  }
  .ed-bloque textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
  .agregar-bloque { margin: 6px 0 26px; }

  /* Fila de destacadas: el titular del mes. */
  /* La primera tarjeta es el titular del mes: más ancha y en oscuro,
     como "Reservas cerradas" en el CRM. Flex y no grid para que la
     ancha y las angostas se acomoden solas en cualquier pantalla. */
  .destacadas-fila { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 30px; }
  .dest-card { flex: 1 1 150px; min-width: 0; }
  .dest-card.hero { flex: 1.7 1 240px; background: var(--ink); border-color: var(--ink); color: #fff; }
  .dest-card.hero .et, .dest-card.hero .de { color: rgba(255,255,255,.62); }
  .dest-card.hero .val { font-size: 48px; }
  .dest-card.hero .val.vacio { color: rgba(255,255,255,.45); }
  .dest-card.hero .delta.nada { color: rgba(255,255,255,.62); }
  .dest-card.hero .delta.bien { background: var(--lime); color: var(--ink); }
  .dest-card {
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: 18px 20px 16px;
  }
  .dest-card .et {
    font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-mute); margin-bottom: 10px;
  }
  .dest-card .val {
    font-family: var(--display); font-size: 40px; font-weight: 500;
    line-height: 1; letter-spacing: -0.02em;
  }
  .dest-card .val.vacio { color: var(--ink-mute); font-weight: 400; font-size: 30px; }
  .dest-card .delta { font-size: 12px; margin-top: 10px; display: inline-block; padding: 2px 7px; border-radius: 6px; }
  .dest-card .delta.bien { background: var(--lime-soft); }
  .dest-card .delta.bien::before { content: '▲ '; }
  .dest-card .delta.mal { background: var(--coral-soft); color: #B2405E; }
  .dest-card .delta.mal::before { content: '▼ '; }
  .dest-card .delta.nada { color: var(--ink-mute); padding-left: 0; }
  .dest-card .de { display: block; font-size: 10px; color: var(--ink-mute); margin-top: 8px;
                   letter-spacing: .05em; text-transform: uppercase; }

  main { min-width: 0; }
  .cabecera { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
  .cabecera h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 40px;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .cabecera h1 em { font-style: italic; color: var(--accent); }
  .cabecera .sub { color: var(--ink-soft); margin-top: 6px; }
  .acciones { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; flex-shrink: 0; padding-top: 8px; }
  .acciones .mes-nav { margin-right: 6px; }
  .pill {
    display: inline-block;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--line-soft);
    color: var(--ink-soft);
    vertical-align: middle;
  }
  .pill.pub { background: var(--lime-soft); color: var(--ink); }
  .btn {
    border: 1px solid var(--line);
    background: var(--bg-elev);
    border-radius: 9px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
  }
  .btn:hover { border-color: var(--ink-mute); }
  .btn.primario { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primario:hover { background: #2a2331; }
  .btn.lima { background: var(--lime); border-color: var(--lime); }
  .btn.chico { padding: 5px 10px; font-size: 13px; }
  .btn.quieto { border: none; background: none; color: var(--ink-mute); }
  .btn.quieto:hover { color: var(--coral); }
  .btn[disabled] { opacity: .5; cursor: default; }

  .prosa { max-width: 62ch; white-space: pre-wrap; color: var(--ink); }
  .prosa.mute { color: var(--ink-soft); }
  /* Análisis: bloque propio. Mientras sea borrador generado, se avisa. */
  .analisis h2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .borrador-tag { font-size: 11px; font-weight: 500; letter-spacing: .03em; text-transform: uppercase;
                  background: var(--coral-soft); color: #B2405E; padding: 3px 9px; border-radius: 999px; }
  .analisis .aviso { font-size: 12px; color: var(--ink-mute); margin: 0 0 12px; max-width: 62ch; }
  .analisis.es-borrador .prosa { border-left: 3px solid var(--coral-soft); padding-left: 14px; }

  /* Solapas del reporte */
  .solapas { display: flex; gap: 26px; border-bottom: 1px solid var(--linea, #e6e3dc);
             margin: 22px 0 26px; overflow-x: auto; }
  .solapa { background: none; border: 0; padding: 0 0 12px; cursor: pointer;
            text-align: left; white-space: nowrap; border-bottom: 2px solid transparent;
            margin-bottom: -1px; font: inherit; color: var(--ink-mute); }
  .solapa .t { display: block; font-weight: 700; font-size: 17px; line-height: 1.2; }
  .solapa .s { display: block; font-size: 12px; margin-top: 2px; }
  .solapa.activa { color: var(--ink, #1a1a1a); border-bottom-color: currentColor; }
  .solapa:hover { color: var(--ink, #1a1a1a); }
  .pane { display: none; }
  .pane.activa { display: block; }
  .bloque { margin-top: 38px; }
  .bloque h2 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 24px;
    margin-bottom: 14px;
  }
  .bloque h2 small { font-family: var(--body); font-size: 13px; color: var(--ink-mute); font-weight: 400; margin-left: 10px; }

  .metricas {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 10px;
  }
  .met {
    background: var(--bg-elev);
    border-radius: var(--radius-lg);
    padding: 16px 18px 14px;
    border: 1px solid var(--line);
  }
  .met .et { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
  .met .val { font-family: var(--display); font-size: 27px; font-weight: 500; line-height: 1; letter-spacing: -0.01em; }
  .met .delta { font-size: 12px; margin-top: 8px; display: inline-block; padding: 2px 7px; border-radius: 6px; }
  .met .delta.bien { background: var(--lime-soft); }
  .met .delta.mal  { background: var(--coral-soft); color: #B2405E; }
  .met .delta.nada { color: var(--ink-mute); padding-left: 0; }
  /* Métricas que trae el pull de Instagram, y huecos honestos. */
  .met .fuente { display: block; margin-top: 4px; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-mute); }
  .met .val.vacio { color: var(--ink-mute); font-weight: 400; }
  .met .nota { font-size: 11px; line-height: 1.35; color: var(--ink-mute); margin-top: 8px; }
  .bloque .sincro { font-size: 12px; color: var(--ink-mute); margin: -4px 0 14px; }

  .destacados { list-style: none; display: flex; flex-direction: column; }
  .destacados li {
    display: grid;
    grid-template-columns: 8px 1fr auto;
    gap: 14px;
    align-items: baseline;
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }
  .destacados li:last-child { border-bottom: 1px solid var(--line); }
  .destacados .punto { width: 8px; height: 8px; border-radius: 50%; position: relative; top: -1px; }
  .punto.logro { background: var(--lime); box-shadow: 0 0 0 3px var(--lime-soft); }
  .punto.alerta { background: var(--coral); box-shadow: 0 0 0 3px var(--coral-soft); }
  .punto.dato { background: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-soft); }
  .destacados .txt { max-width: 62ch; }
  .destacados .mod { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
  .destacados .num { font-family: var(--display); font-size: 24px; font-weight: 500; white-space: nowrap; }

  .vacio {
    padding: 48px 0;
    max-width: 48ch;
  }
  .vacio h1 { font-family: var(--display); font-weight: 500; font-size: 32px; margin-bottom: 10px; }
  .vacio p { color: var(--ink-soft); margin-bottom: 20px; }

  /* ── Editor (solo agencia) ── */
  .editor { display: flex; flex-direction: column; gap: 28px; }
  .campo label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .campo input[type=text], .campo input[type=number], .campo input[type=month], .campo select, .campo textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg-elev);
    border-radius: 9px;
    padding: 9px 12px;
  }
  .campo textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  .campo .ayuda { font-size: 12px; color: var(--ink-mute); margin-top: 5px; }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .ed-modulo { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px 20px; }
  .ed-modulo header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .ed-modulo header h3 { font-family: var(--display); font-weight: 500; font-size: 20px; }
  .ed-modulo header label { font-size: 13px; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .ed-modulo.apagado .grilla, .ed-modulo.apagado .agregar { display: none; }
  .grilla { display: flex; flex-direction: column; gap: 6px; }
  .grilla .r {
    display: grid;
    grid-template-columns: 1fr 130px 92px 118px 30px;
    gap: 8px;
    align-items: center;
  }
  .grilla .r.cab { font-size: 12px; color: var(--ink-mute); }
  .grilla input, .grilla select { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; background: var(--bg-elev); }
  .grilla .r.dest { grid-template-columns: 110px 1fr 130px 30px; }
  .agregar { margin-top: 10px; }
  .pie { display: flex; gap: 10px; align-items: center; padding-top: 8px; border-top: 1px solid var(--line); }
  .pie .der { margin-left: auto; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.ver { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.mal { background: var(--coral); }

  /* ── Posts del mes ── */
  .criterios { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .criterios button {
    border: 1px solid var(--line); background: var(--bg-elev); color: var(--ink-soft);
    border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer;
  }
  .criterios button:hover { border-color: var(--ink-mute); }
  .criterios button.activo { background: var(--ink); color: #fff; border-color: var(--ink); }

  .posts { display: flex; flex-direction: column; gap: 10px; }
  .post {
    display: grid; grid-template-columns: 62px 1fr auto; gap: 14px; align-items: center;
    padding: 10px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg-elev); text-decoration: none;
  }
  .post:hover { border-color: var(--ink-mute); }
  .post .thumb {
    width: 62px; height: 62px; border-radius: 8px; object-fit: cover;
    background: var(--line-soft); display: block;
  }
  .post .thumb.falta {
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--ink-mute); text-align: center; line-height: 1.2; padding: 4px;
  }
  .post .cuerpo { min-width: 0; }
  .post .meta { font-size: 12px; color: var(--ink-mute); display: flex; gap: 7px; align-items: center; }
  .post .copy {
    margin-top: 2px; color: var(--ink-soft); font-size: 14px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .post .cifra { text-align: right; white-space: nowrap; }
  .post .cifra .n { font-family: var(--display); font-size: 22px; line-height: 1.1; }
  .post .cifra .q { font-size: 11px; color: var(--ink-mute); text-transform: lowercase; }

  .formatos { width: 100%; border-collapse: collapse; font-size: 14px; }
  .formatos th, .formatos td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line-soft); }
  .formatos th:first-child, .formatos td:first-child { text-align: left; }
  .formatos th { font-size: 12px; color: var(--ink-mute); font-weight: 500; }
  .formatos tbody tr:last-child td { border-bottom: none; }
  .formatos .n-chico { color: var(--ink-mute); font-size: 12px; margin-left: 5px; }
  .formatos td.flojo { color: var(--ink-mute); }

  /* En el celular el menú deja de empujar el contenido y pasa a
     taparlo cuando lo abrís, igual que en administración. */

  @media (max-width: 760px) {

    /* El mes ocupa su propia fila y los botones van juntos abajo. */
    .acciones .mes-nav { margin-right: 0; flex-basis: 100%; justify-content: space-between; }

  @media (prefers-reduced-motion: reduce) { .toast, .sidebar, .tapa-menu { transition: none; } }

<body>

<div class="barra-movil">
  <button type="button" id="bmMenu" aria-label="Abrir el menú">

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-name">Co<em>Makers.</em><svg class="brand-spark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1 L13.8 9.4 L22 12 L13.8 14.6 L12 23 L10.2 14.6 L2 12 L10.2 9.4 Z"/></svg></div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="13" y2="17"></line></svg>
        Reportes
      </button>
    </nav>

    <div class="sidebar-footer">
      <a class="link-interno" id="linkInterno" href="interno.html" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>

  <main class="main" id="main">
