<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión · CoMakers</title>
<style>
  :root{
    --lime:#D3FF99; --accent:#FF82FF; --ink:#1B1620; --ink-soft:#5B525E;
    --body:'DM Sans',-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--body);background:var(--lime);color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:320px}
  svg{width:56px;height:56px;margin-bottom:20px}
  h1{font-size:20px;font-weight:600;letter-spacing:-0.02em;margin-bottom:8px}
  p{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-bottom:24px}
  button{
    background:var(--accent);color:var(--ink);border:none;border-radius:10px;
    padding:11px 20px;font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer;
  }
  button:hover{opacity:.88}
</style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#fff"/>
      <path d="M20.8 9.6A8 8 0 1 0 20.8 20.4" fill="none" stroke="#FF82FF" stroke-width="5" stroke-linecap="round"/>
      <circle cx="25.4" cy="25.4" r="3" fill="#FF82FF"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>No pudimos cargar el panel. Revisá tu conexión a internet y volvé a intentar.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
